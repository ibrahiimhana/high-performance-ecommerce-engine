# Nginx in front of the three Django app servers.
# Strategy: least_conn — sends each request to the worker with the fewest
# active connections. Better than round-robin here because checkout takes
# 50–200ms while browsing takes ~5ms; round-robin would happily pile heavy
# requests on a worker that's already busy with one.

worker_processes auto;
events { worker_connections 1024; }

http {
    upstream django_pool {
        least_conn;
        server web1:8000 max_fails=3 fail_timeout=10s;
        server web2:8000 max_fails=3 fail_timeout=10s;
        server web3:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Per-IP rate limit on top of the in-process semaphore so a single
    # client can't drain the pool.
    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;

    server {
        listen 80;
        server_tokens off;

        # Lets us see which upstream served the request from curl/headers.
        add_header X-Served-By $upstream_addr always;

        location / {
            limit_req zone=api burst=400 nodelay;

            proxy_pass http://django_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
