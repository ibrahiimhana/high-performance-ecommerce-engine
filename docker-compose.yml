# 3 Django app servers behind Nginx, Postgres + Redis + Celery worker + beat.
services:
  postgres:
    image: postgres:16-alpine
    container_name: hpe_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    ports:
      - "5433:5432"   # 5433 on host to avoid clashing with local Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hpe_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Runs migrations once before the web pool starts so three workers don't
  # race to apply the same migration.
  migrator:
    build: .
    image: hpe_app:latest
    container_name: hpe_migrator
    env_file: .env
    environment:
      ROLE: migrator
    command: ["sh", "-c",
              "python manage.py makemigrations accounts catalog cart orders core --noinput && python manage.py migrate --noinput"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  web1: &web
    build: .
    image: hpe_app:latest
    container_name: hpe_web1
    env_file: .env
    environment:
      INSTANCE_NAME: web1
    # 3 workers x 4 threads. --max-requests recycles workers so any leaked
    # memory doesn't accumulate forever.
    command: ["gunicorn", "config.wsgi:application",
              "--bind", "0.0.0.0:8000",
              "--workers", "3",
              "--threads", "4",
              "--worker-class", "gthread",
              "--max-requests", "1000",
              "--max-requests-jitter", "100",
              "--timeout", "60",
              "--access-logfile", "-"]
    depends_on:
      migrator:
        condition: service_completed_successfully
    expose:
      - "8000"

  web2:
    <<: *web
    container_name: hpe_web2
    environment:
      INSTANCE_NAME: web2

  web3:
    <<: *web
    container_name: hpe_web3
    environment:
      INSTANCE_NAME: web3

  nginx:
    image: nginx:1.27-alpine
    container_name: hpe_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web1
      - web2
      - web3

  celery_worker:
    build: .
    image: hpe_app:latest
    container_name: hpe_celery_worker
    env_file: .env
    environment:
      INSTANCE_NAME: celery
    command: ["celery", "-A", "config", "worker",
              "--loglevel=INFO",
              "--concurrency=4",
              "--max-tasks-per-child=500"]
    depends_on:
      migrator:
        condition: service_completed_successfully

  celery_beat:
    build: .
    image: hpe_app:latest
    container_name: hpe_celery_beat
    env_file: .env
    environment:
      INSTANCE_NAME: beat
    command: ["celery", "-A", "config", "beat",
              "--loglevel=INFO",
              "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      migrator:
        condition: service_completed_successfully

  # Behind a profile so `docker compose up -d` does NOT start it.
  # Run with: docker compose --profile loadtest run --rm locust
  locust:
    image: locustio/locust:2.31.5
    container_name: hpe_locust
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/mnt/locust
    command:
      - "-f"
      - "/mnt/locust/locustfile.py"
      - "--host"
      - "http://nginx"
      - "--users"
      - "100"
      - "--spawn-rate"
      - "10"
      - "--run-time"
      - "60s"
      - "--headless"
      - "--html"
      - "/mnt/locust/report.html"
      - "--csv"
      - "/mnt/locust/results"
      - "--csv-full-history"
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
